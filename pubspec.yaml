name: maala_app
description: "Maala - a japa mala counter and meditation timer app."
publish_to: 'none'
version: 1.0.5+7

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.5.0
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: any
  google_fonts: ^6.2.1
  image_color_scheme: ^1.0.5
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  image_path: "assets/images/icon_image.jpg"
  android: true
  ios: true
